<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img"><title>Entity agreement: one source, consistent facts</title><desc>Authoritative source: Named content or data owner, Verified business identifiers, Supported factual claims; Visible page: Clear subject and purpose, Current product or service facts, Readable evidence and context; Structured data: Suitable type and properties, Stable entity relationships, Facts match the visible page; Public profiles: Consistent name and contact, Only genuine sameAs links, No invented affiliations; Validation: Parse syntax and check types, Check feature-specific policies, Review variants and empty states; Maintenance: Detect changed or removed facts, Reconcile catalogue and feeds, Assign review after releases</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#131513"/><stop offset="1" stop-color="#252d29"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#354039"/><stop offset="1" stop-color="#202822"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ff9b24" stroke-width="1.8"/></marker></defs><rect width="1400" height="680" rx="28" fill="url(#bg)"/><text x="54" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#ff9b24" font-weight="700">OZAIRWEBS / PRACTICAL KNOWLEDGE</text><text x="54" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="37" fill="#faf2e3" font-weight="700">Entity agreement: one source, consistent facts</text><text x="54" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#e0e5df" font-weight="400">Structured data should describe the information that a visitor can inspect.</text><rect x="62" y="220" width="405" height="166" rx="17" fill="#090e0b"/><rect x="54" y="210" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="54" y="210" width="405" height="5" rx="2" fill="#ff9b24"/><text x="74" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">01  Authoritative source</text><text x="74" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Named content or data owner</text><text x="74" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Verified business identifiers</text><text x="74" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Supported factual claims</text><path d="M464 295 H487" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="504" y="220" width="405" height="166" rx="17" fill="#090e0b"/><rect x="496" y="210" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="496" y="210" width="405" height="5" rx="2" fill="#ff9b24"/><text x="516" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">02  Visible page</text><text x="516" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Clear subject and purpose</text><text x="516" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Current product or service facts</text><text x="516" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Readable evidence and context</text><path d="M906 295 H929" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="946" y="220" width="405" height="166" rx="17" fill="#090e0b"/><rect x="938" y="210" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="938" y="210" width="405" height="5" rx="2" fill="#ff9b24"/><text x="958" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">03  Structured data</text><text x="958" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Suitable type and properties</text><text x="958" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Stable entity relationships</text><text x="958" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Facts match the visible page</text><rect x="62" y="420" width="405" height="166" rx="17" fill="#090e0b"/><rect x="54" y="410" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="54" y="410" width="405" height="5" rx="2" fill="#ff9b24"/><text x="74" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">04  Public profiles</text><text x="74" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Consistent name and contact</text><text x="74" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Only genuine sameAs links</text><text x="74" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">No invented affiliations</text><path d="M464 495 H487" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="504" y="420" width="405" height="166" rx="17" fill="#090e0b"/><rect x="496" y="410" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="496" y="410" width="405" height="5" rx="2" fill="#ff9b24"/><text x="516" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">05  Validation</text><text x="516" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Parse syntax and check types</text><text x="516" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Check feature-specific policies</text><text x="516" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Review variants and empty states</text><path d="M906 495 H929" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="946" y="420" width="405" height="166" rx="17" fill="#090e0b"/><rect x="938" y="410" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="938" y="410" width="405" height="5" rx="2" fill="#ff9b24"/><text x="958" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">06  Maintenance</text><text x="958" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Detect changed or removed facts</text><text x="958" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Reconcile catalogue and feeds</text><text x="958" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Assign review after releases</text><text x="54" y="644" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#ffb652" font-weight="600">Valid syntax and eligibility do not promise a rich result or an AI citation.</text></svg>