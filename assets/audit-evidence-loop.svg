l="#e0e5df" font-weight="400">Observed fault versus hypothesis</text><text x="958" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Affected templates and URLs</text><text x="958" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Severity and confidence apart</text><rect x="62" y="420" width="405" height="166" rx="17" fill="#090e0b"/><rect x="54" y="410" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="54" y="410" width="405" height="5" rx="2" fill="#ff9b24"/><text x="74" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">04  Assign the change</text><text x="74" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Named implementation owner</text><text x="74" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Expected behaviour and effort</text><text x="74" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Dependencies and review point</text><path d="M464 495 H487" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="504" y="420" width="405" height="166" rx="17" fill="#090e0b"/><rect x="496" y="410" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="496" y="410" width="405" height="5" rx="2" fill="#ff9b24"/><text x="516" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">05  Retest deployed output</text><text x="516" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Positive and failure states</text><text x="516" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Compare actual template output</text><text x="516" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Attach acceptance evidence</text><path d="M906 495 H929" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="946" y="420" width="405" height="166" rx="17" fill="#090e0b"/><rect x="938" y="410" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="938" y="410" width="405" height="5" rx="2" fill="#ff9b24"/><text x="958" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">06  Report learning</text><text x="958" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Comparable outcome periods</text><text x="958" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Describe confounding changes</text><text x="958" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Keep inconclusive findings</text><text x="54" y="644" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#ffb652" font-weight="600">Removing a technical constraint does not guarantee crawling, indexing, traffic or citations.</text></svg>