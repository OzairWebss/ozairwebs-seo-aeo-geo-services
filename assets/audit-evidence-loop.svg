<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img"><title>A search audit: evidence into a retested decision</title><desc>Define scope: Audience and valuable journeys, Representative URL groups, Agreed business questions; Gather evidence: Requests and rendered pages, Index and canonical directives, Permitted analytics and logs; Classify findings: Observed fault versus hypothesis, Affected templates and URLs, Severity and confidence apart; Assign the change: Named implementation owner, Expected behaviour and effort, Dependencies and review point; Retest deployed output: Positive and failure states, Compare actual template output, Attach acceptance evidence; Report learning: Comparable outcome periods, Describe confounding changes, Keep inconclusive findings</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#131513"/><stop offset="1" stop-color="#252d29"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#354039"/><stop offset="1" stop-color="#202822"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ff9b24" stroke-width="1.8"/></marker></defs><rect width="1400" height="680" rx="28" fill="url(#bg)"/><text x="54" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#ff9b24" font-weight="700">OZAIRWEBS / PRACTICAL KNOWLEDGE</text><text x="54" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="37" fill="#faf2e3" font-weight="700">A search audit: evidence into a retested decision</text><text x="54" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#e0e5df" font-weight="400">Read top row left to right, then the lower row. This is a workflow, not a ranking chart.</text><rect x="62" y="220" width="405" height="166" rx="17" fill="#090e0b"/><rect x="54" y="210" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="54" y="210" width="405" height="5" r