ect private access controls</text><path d="M906 495 H929" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="946" y="420" width="405" height="166" rx="17" fill="#090e0b"/><rect x="938" y="410" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="938" y="410" width="405" height="5" rx="2" fill="#ff9b24"/><text x="958" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">06  Observe outcomes</text><text x="958" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Log the evidence you can verify</text><text x="958" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Track actual source mentions</text><text x="958" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Separate absence from failure</text><text x="54" y="644" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#ffb652" font-weight="600">Search visibility, training access and user-requested retrieval are different decisions.</text></svg>